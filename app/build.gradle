plugins {
    id 'com.android.application'
}

// Plugin Firebase hanya aktif bila google-services.json ada, sehingga build pertama tetap berhasil
// sebelum Firebase disiapkan (notifikasi FCM baru aktif setelah file itu ada).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Alamat dashboard: dari env DASHBOARD_URL (secret GitHub) atau -PDASHBOARD_URL=... saat build lokal.
def dashUrl = (System.getenv('DASHBOARD_URL') ?: project.findProperty('DASHBOARD_URL') ?: 'https://dashboard.contoh.id')
        .toString().trim().replaceAll('/+$', '')
def runNo = System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1

android {
    namespace 'id.pandu.monitoringclient'
    compileSdk 34

    defaultConfig {
        applicationId 'id.pandu.monitoringolt'
        minSdk 24
        targetSdk 34
        versionCode 1000 + runNo          // naik otomatis tiap build GitHub, supaya APK baru bisa menimpa yang lama
        versionName '2.0.' + runNo
        buildConfigField 'String', 'BASE_URL', "\"${dashUrl}\""
        manifestPlaceholders = [usesCleartext: dashUrl.startsWith('http://') ? 'true' : 'false']
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Tanpa keystore rilis, dipakai kunci debug (APK tetap terpasang, tapi tidak bisa menimpa build dari runner lain).
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
