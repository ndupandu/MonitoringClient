name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tulis google-services.json (FCM)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > app/google-services.json
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON kosong: APK dibuat tanpa FCM."
          fi

      - name: Siapkan keystore rilis (opsional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 kosong: APK ditandatangani kunci debug (tidak bisa menimpa build lain)."
          fi

      - name: Periksa DASHBOARD_URL
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ -z "$DASHBOARD_URL" ]; then
            echo "::error::Secret DASHBOARD_URL kosong (atau dibuat di tab Variables, bukan Secrets)."; exit 1
          fi
          echo "Skema : $(echo "$DASHBOARD_URL" | sed -E 's#^([a-zA-Z]+)://.*#\1#;t;s#.*#(tanpa skema)#')"
          echo "Jalur : '$(echo "$DASHBOARD_URL" | sed -E 's#^[a-zA-Z]+://[^/]*##')'  (harus kosong atau '/'; bagian ini dibuang otomatis oleh build)"

      - name: Build APK
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MonitoringClient-apk
          path: app/build/outputs/apk/release/*.apk
